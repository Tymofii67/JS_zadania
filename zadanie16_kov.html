<html>
    <head>
        <title>Kovalchuk 2p</title>
    </head>
    <body>
        <div style="color:green;font-size:50px;">
            <script language="JavaScript">
var a_kov = prompt("Podaj a:");
    var a_kov = parseFloat(a_kov);
    var b_kov = prompt("Podaj b:");
    var b_kov = parseFloat(b_kov);
    document.write("Wczytanie liczby: A="+a_kov+" B="+b_kov+"<br>");
    document.write("("+a_kov+"+"+b_kov+")"+"<sup>3</sup>="+a_kov+"<sup>3</sup>+3*"+a_kov+"<sup>2</sup>*"+b_kov+"+3*"+a_kov+"*"+b_kov+"<sup>2</sup>+"+b_kov+"<sup>3</sup><br>");
    var odp_kov;
    odp_kov = ((a_kov*a_kov*a_kov) + 3*(a_kov*a_kov)*b_kov + 3*a_kov*(b_kov*b_kov) + (b_kov*b_kov*b_kov));
    document.write("= "+odp_kov);

            </script>
        </div>
    </body>
</html>
