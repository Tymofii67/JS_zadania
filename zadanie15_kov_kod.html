   <html>
    <head>
        <meta charset="UTF-8">
         <title>Kovalchuk 2p</title>
    </head>
    <body>
        <div style="color:green;font-size:50px;">
            <script language="JavaScript">
                var liczba = prompt("Podaj mianownik:", "");
                var m_kov = parseFloat(liczba);
                document.write("m = " + m_kov + "<br>");
                var m1 = 2 * m_kov;
                var m2 = 2 * m_kov;
                document.write("1/" + m_kov + " = 1/" + m1 + " + 1/" + m2 + "<br>");
            </script>
        </div>
    </body>
</html>
