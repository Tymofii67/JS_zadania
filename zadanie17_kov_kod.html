2. Czym jest funkcja w JS, omów przy użyciu 4 podpunktów? 
<br>
Jest to zbiór zgrupowanych instrukcji, które możemy uruchamiać  poprzez podanie ich nazwy, <br>
 Każda funkcja po wywołaniu wykonuje swój wewnętrzny kod, <br>
 Funkcja może mieć argumenty, które wchodzą do wnętrza funkcji i są tam przetwarzane np. 
  suma_kry(a, b), <br>
 Może(nie zawsze) zwrócić  obliczoną wartość  zapisaną po słowie kluczowym return.<br>
3. Omów metody <b>getElementsByName, getElementById, getElementByTagName</b> (może być w postaci tabeli), 
<br>
getElementById("id ") - dostęp do wszystkich elementów o konkretnej wartości atrybutu id  <br>
getElementByTagName("znacznik ") - dostęp do wszystkich elementów o typie znacznika, np. P lub DIV  <br>
getElementByName("nazwa") - dostęp do wszystkich elementów o konkretnej wartości atrybutu   <br>
4. Omów właściwości <b> innerHTML  innerText  className.</b> (każdą osobno)
<br>
- <b>innerHTML</b> – jest to właściwość, która umożliwia odczyt, zmodyfikowanie, wstawienie, albo 
usunięcie kodu HTML z danego elementu HTML np. w tabeli, <br>
- <b>innerText</b> – umożliwia określenie ciągu znaków który zostanie umieszczony w elemencie, <br>
- <b>className</b> – umożliwia określenie klasy CSS użytej do prezentacji elementu.
