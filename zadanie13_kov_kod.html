<html> 
   <body> 
     <textarea cols="90" rows="24"> 
  <!DOCTYPE html>
<head>
     <title>Kovalchuk 2p</title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:green;font-size:50px;">
        <script language="JavaScript">
            var liczba1=prompt("daj mianownik m=","");
            var m_kov=parseFloat(liczba1);

            document.write("m="+m_kov+"<br>");
            m1=m_kov+1;
            m2=(m_kov+1)*m_kov;

            document.write("1/"+m_kov+"=1/"+m1+"+1/"+m2+"<br>");
            function okno_zamknij_kovalchuk() 
                 { 
                   window.close()   
                 } 
        </script>
    </div>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_kovalchuk()"/> 
</body>
     </textarea>
   </body>
</html>
